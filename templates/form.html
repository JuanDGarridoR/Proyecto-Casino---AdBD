{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="card-title mb-3">{{ titulo }}</h4>
    {% if ayuda %}<p class="text-muted">{{ ayuda }}</p>{% endif %}
    <form method="post" novalidate>{% csrf_token %}
      {% include '_campos.html' %}
      <button class="btn btn-primary">Guardar</button>
      <a class="btn btn-link" href="{% if volver_url %}{{ volver_url }}{% else %}{% url volver %}{% endif %}">Cancelar</a>
    </form>
    {% if sugerencias %}{% include '_sugerencias.html' %}{% endif %}
  </div></div>
</div></div>
{% endblock %}
