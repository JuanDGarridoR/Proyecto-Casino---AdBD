{% extends 'base.html' %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="card-title mb-4 text-center"><i class="bi bi-shield-lock"></i> Iniciar sesión</h3>
    <form id="form-login" method="post" data-desafio="{% url 'cuentas:desafio' %}">{% csrf_token %}
      <div class="alert alert-danger d-none zk-error"></div>
      <div class="mb-3">
        <label class="form-label" for="username">Usuario</label>
        <input class="form-control" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        {# Sin atributo name: la contraseña nunca se envía al servidor. #}
        <input class="form-control" id="password" type="password" required autocomplete="current-password">
      </div>
      <input type="hidden" name="respuesta">
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
    <hr>
    <p class="text-center mb-0">¿Es un jugador nuevo? <a href="{% url 'cuentas:registro' %}">Regístrese aquí</a></p>
  </div></div>
</div></div>
{% endblock %}
